name: Feature request
description: Something most apps built on Pundasyon would need.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it would work for the people using the app, or for developers building on it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other options you considered
      description: For example a package, or doing it in your own app. See docs/building-features.md for how features are added.
