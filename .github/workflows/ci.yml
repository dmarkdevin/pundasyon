name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Style and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer lint
      - run: composer analyse
      - name: Known vulnerabilities in dependencies
        run: |
          composer audit
          npm ci --ignore-scripts
          npm audit --omit=dev

  tests:
    name: Tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mysql, pgsql]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: testing
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=5s --health-retries=10
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testing
        ports: ['5432:5432']
        options: --health-cmd=pg_isready --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DB_CONNECTION: ${{ matrix.database }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.database == 'pgsql' && '5432' || '3306' }}
      DB_DATABASE: ${{ matrix.database == 'sqlite' && ':memory:' || 'testing' }}
      DB_USERNAME: ${{ matrix.database == 'pgsql' && 'postgres' || 'root' }}
      DB_PASSWORD: ${{ matrix.database == 'pgsql' && 'postgres' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_pgsql, pdo_sqlite
          coverage: ${{ matrix.database == 'sqlite' && 'pcov' || 'none' }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Run tests
        if: matrix.database != 'sqlite'
        run: vendor/bin/pest
      - name: Run tests with coverage
        if: matrix.database == 'sqlite'
        run: vendor/bin/pest --coverage

  module-generator:
    name: Module generator
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      # Generates sample modules with every field type, checks them like hand-written code, then removes them.
      - run: bash scripts/check-module-generator.sh

  # The README's quick start on a clean machine with only Docker, on Intel/AMD and on ARM
  # (what Docker Desktop runs on Apple Silicon).
  fresh-install:
    name: Fresh install (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: cp .env.example .env
      - name: Install PHP packages with Sail's image
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$(pwd):/var/www/html" -w /var/www/html \
            laravelsail/php84-composer:latest composer install --ignore-platform-reqs --no-interaction --no-progress
      - run: ./vendor/bin/sail up -d --wait
      - name: Install with demo data
        # A throwaway password for this test run only.
        run: ./vendor/bin/sail artisan app:install --demo --name=Owner --email=owner@example.com --password="Fresh-install-$GITHUB_RUN_ID" --no-interaction
      - run: ./vendor/bin/sail npm install && ./vendor/bin/sail npm run build
      - name: The sign-in page answers
        run: curl -fsS -o /dev/null http://localhost:8087/app/login
      - if: failure()
        run: ./vendor/bin/sail logs --tail=80
      - if: always()
        run: ./vendor/bin/sail down -v
